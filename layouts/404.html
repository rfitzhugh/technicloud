<!DOCTYPE HTML>
<html lang="{{ with .Site.Language.Locale }}{{ . }}{{ else }}en-US{{ end }}">
	{{ partial "header.html" . }}
	<body>
		<div id="wrapper">
			{{ partial "nav.html" . }}
			<div id="main">
				<div class="inner">
					<h1>{{ .Site.Params.Error404.heading }}</h1>
					<p>{{ .Site.Params.Error404.text | markdownify }}</p>
				</div>
			</div>
			{{ if .Site.Params.Footer.enable }}
				{{ partial "footer.html" . }}
			{{ end }}
		</div>
		{{ partial "js.html" . }}
	</body>
</html>
