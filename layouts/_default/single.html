<!DOCTYPE HTML>
<html lang="{{ with .Site.Language.Locale }}{{ . }}{{ else }}en-US{{ end }}">
    {{ partial "header.html" . }}
    <body>
        <div id="wrapper">
            {{ partial "nav.html" . }}

            <div id="main" class="alt">
                <section id="one">
                    <div class="inner">
                        <header class="major">
                            <h1>{{ .Title }}</h1>
                        </header>
                        {{ with .Params.image }}
                            <span class="image main"><img src="{{ printf "img/%s" . | relURL }}" alt="" /></span>
                        {{ end }}
                        {{ .Content }}
                    </div>
                </section>
            </div>

            {{ if .Site.Params.footer.enable }}
                {{ partial "footer.html" . }}
            {{ end }}
        </div>

        {{ partial "js.html" . }}
    </body>
</html>
